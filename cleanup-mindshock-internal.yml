name: Limpiar archivos internos de MindShock

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/cleanup-mindshock-internal.yml"

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Eliminar notas internas
        shell: bash
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git rm -f --ignore-unmatch             SUBIR_A_GITHUB.txt             CAMBIOS_BROWSER_USE.md             .github/workflows/cleanup-mindshock-internal.yml

          if git diff --cached --quiet; then
            echo "No hay archivos internos pendientes."
            exit 0
          fi

          git commit -m "Remove internal MindShock files"
          git push origin HEAD:main
